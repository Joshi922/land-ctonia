<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ctônia — Portal</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#1B132B">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Ctônia">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Bibliotecas Externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- jsPDF para gerar PDF e SortableJS para arrastar -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

    <script>try{if(localStorage.getItem("ct-theme")==="light")document.documentElement.classList.add("light")}catch(e){}</script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: Object.fromEntries(['abyssal','indigo','night','mint','mystic','luminous','magenta','salmon'].map(n=>[n,`rgb(var(--${n}) / <alpha-value>)`]))
                    ,
                    fontFamily: {
                        serif: ['Cinzel', 'serif'],
                        sans: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        :root{--abyssal:27 19 43;--indigo:37 43 80;--night:74 110 138;--mint:30 77 79;--mystic:59 140 136;--luminous:123 240 195;--magenta:232 90 113;--salmon:255 190 166;--glow:255 190 166}
        /* Modo claro: Areia #E4DCC4, Terracota #DA6A4E, Cobre #A25732, Coral #E1414F, Amarelo-Sol #FFE268, Ciano #00D0FE, Azul-bebê #A9E9FF */
        html.light{--abyssal:228 220 196;--indigo:240 234 216;--night:162 87 50;--mint:255 226 104;--mystic:218 106 78;--luminous:0 208 254;--magenta:225 65 79;--salmon:58 31 18;--glow:169 233 255}
        html.light .bg-magenta{color:#fff!important}
        html.light .bg-luminous{color:#3A1F12!important}
        html.light body{background-image:radial-gradient(circle at 85% 0%,rgba(169,233,255,.55),transparent 45%),radial-gradient(circle at 0 100%,rgba(255,226,104,.35),transparent 40%)}
        body{background-color:rgb(var(--abyssal));color:rgb(var(--salmon));margin:0;overflow-x:hidden;font-family:'Montserrat',sans-serif;transition:background-color .3s,color .3s}
        ::selection{background:rgb(var(--glow)/.6)}
        .bg-noise{position:fixed;top:0;left:0;width:100%;height:100vh;pointer-events:none;z-index:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E")}
        .title-glow{text-shadow:0 0 20px rgb(var(--glow)/.3)}
        ::-webkit-scrollbar{width:8px;height:8px}
        ::-webkit-scrollbar-track{background:rgb(var(--abyssal))}
        ::-webkit-scrollbar-thumb{background:rgb(var(--night));border-radius:4px}
        ::-webkit-scrollbar-thumb:hover{background:rgb(var(--mystic))}
        .fade-in{animation:fadeIn .4s ease forwards}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .tool-card{position:relative;isolation:isolate;background-color:rgb(var(--indigo));border:1px solid rgb(var(--night));transition:all .3s cubic-bezier(.25,.46,.45,.94)}
        .tool-card::before{content:'';position:absolute;inset:-2px;border-radius:inherit;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgb(var(--glow)/.20),transparent 68%);opacity:.52;filter:blur(13px);transition:opacity .3s,filter .3s}
        .tool-card:hover{border-color:rgb(var(--luminous));background-color:rgb(var(--mint));transform:translateY(-5px);box-shadow:0 0 24px rgb(var(--glow)/.22),0 10px 30px -10px rgb(var(--mint)/.6)}
        .tool-card:hover::before{opacity:.95;filter:blur(17px)}
        .tool-card:hover h3{color:rgb(var(--salmon))}
        .tool-card:hover .icon-wrapper{color:rgb(var(--luminous));transform:scale(1.1)}
        .editor-canvas-bg{background-image:linear-gradient(45deg,rgb(var(--abyssal)) 25%,transparent 25%,transparent 75%,rgb(var(--abyssal)) 75%),linear-gradient(45deg,rgb(var(--abyssal)) 25%,transparent 25%,transparent 75%,rgb(var(--abyssal)) 75%);background-size:20px 20px;background-position:0 0,10px 10px;background-color:rgb(var(--indigo))}
        .modal-overlay{background-color:rgb(var(--abyssal)/.85);backdrop-filter:blur(4px)}
        /* Portal Ctônia */
        #portal-view{min-height:100vh;background:radial-gradient(ellipse at 50% 0%,rgb(var(--mint)/.22),transparent 46%),rgb(var(--abyssal));}
        .portal-header{position:sticky;top:0;z-index:40;backdrop-filter:blur(16px);background:rgb(var(--abyssal)/.76);border-bottom:1px solid rgb(var(--night)/.5)}
        .portal-brand{font-family:'Cinzel',serif;letter-spacing:.28em;text-shadow:0 0 12px rgb(var(--glow)/.22),0 0 28px rgb(var(--glow)/.16)}
        .portal-card{position:relative;isolation:isolate;min-height:clamp(260px,36vw,430px);border:1px solid rgb(var(--mystic)/.42);background:linear-gradient(160deg,rgb(var(--indigo)/.92),rgb(var(--abyssal)/.95));border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px 14px;text-align:center;overflow:hidden;transition:transform .24s ease,border-color .24s ease,box-shadow .24s ease,background .24s ease;color:rgb(var(--mystic));text-decoration:none;cursor:pointer}
        .portal-card::before{content:'';position:absolute;inset:-15%;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,rgb(var(--mystic)/.22),transparent 60%);filter:blur(18px);opacity:.78;transition:all .24s ease}
        .portal-card::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(145deg,transparent 25%,rgb(var(--glow)/.06),transparent 72%);opacity:.3;transition:opacity .24s ease}
        .portal-card:hover,.portal-card:focus-visible{transform:translateY(-7px);border-color:rgb(var(--glow)/.9);color:rgb(var(--glow));box-shadow:0 0 0 1px rgb(var(--glow)/.16),0 0 32px rgb(var(--glow)/.24),0 18px 45px rgb(0 0 0/.2);outline:none}
        .portal-card:hover::before,.portal-card:focus-visible::before{background:radial-gradient(ellipse at 50% 48%,rgb(var(--glow)/.42),transparent 62%);filter:blur(23px);opacity:1}
        .portal-card:hover::after{opacity:.9}
        .portal-card .portal-symbol{font-size:clamp(3.2rem,5vw,5rem);filter:drop-shadow(0 0 12px rgb(var(--mystic)/.35));transition:transform .24s ease,filter .24s ease,color .24s ease}
        .portal-card:hover .portal-symbol{transform:scale(1.1);filter:drop-shadow(0 0 17px rgb(var(--glow)/.72))}
        .portal-card-title{font-family:'Cinzel',serif;font-size:clamp(.8rem,1.1vw,1rem);font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:rgb(var(--salmon));transition:color .24s ease,text-shadow .24s ease}
        .portal-card:hover .portal-card-title{color:rgb(var(--glow));text-shadow:0 0 16px rgb(var(--glow)/.5)}
        .portal-card .portal-caption{font-size:.72rem;line-height:1.6;color:rgb(var(--mystic));max-width:15rem}
        html.light .portal-card{background:linear-gradient(160deg,rgb(var(--indigo)/.94),rgb(var(--abyssal)/.96))}
        /* No modo claro, preserva o fundo original do card: só muda o tom da reação luminosa azulada para roxo-obsidiana. */
        html.light .portal-card:hover,html.light .portal-card:focus-visible{background:linear-gradient(160deg,rgb(var(--indigo)/.94),rgb(var(--abyssal)/.96));border-color:#8b70b5;box-shadow:0 0 0 1px rgb(111 76 151/.16),0 0 26px rgb(73 43 105/.22),0 18px 45px rgb(30 15 45/.12)}
        html.light .portal-card:hover::before,html.light .portal-card:focus-visible::before{background:radial-gradient(ellipse at 50% 48%,rgb(76 43 105/.32),transparent 64%);filter:blur(22px);opacity:.95}
        html.light .portal-card:hover .portal-symbol,html.light .portal-card:focus-visible .portal-symbol{color:rgb(var(--glow));filter:drop-shadow(0 0 10px rgb(76 43 105/.42))}
        html.light .portal-card:hover .portal-card-title,html.light .portal-card:focus-visible .portal-card-title{color:rgb(var(--glow));text-shadow:0 0 12px rgb(76 43 105/.28)}
        /* Os cards de ferramentas também mantêm o fundo-base no hover do tema claro; apenas o halo fica roxo-obsidiana. */
        html.light .tool-card:hover{background-color:rgb(var(--indigo));border-color:#8b70b5;box-shadow:0 0 24px rgb(76 43 105/.20),0 10px 30px -10px rgb(30 15 45/.14)}
        html.light .tool-card:hover::before{background:radial-gradient(ellipse at 50% 45%,rgb(76 43 105/.30),transparent 68%);opacity:.95;filter:blur(17px)}
        @media(prefers-reduced-motion:reduce){.portal-card,.portal-card *,.tool-card,.tool-card::before{transition:none!important;animation:none!important}}
    </style>

<style>
#ctonia-portal-back{position:fixed;top:16px;left:16px;z-index:99999;width:42px;height:42px;display:none;align-items:center;justify-content:center;border:1px solid rgba(129,140,248,.28);border-radius:12px;background:rgba(15,23,42,.72);color:var(--salmon,#d7c3a5);font-size:24px;line-height:1;text-decoration:none;box-shadow:0 0 18px rgba(99,102,241,.12);backdrop-filter:blur(8px);transition:color .18s,border-color .18s,box-shadow .18s,transform .18s}
#ctonia-portal-back:hover{color:#c4b5fd;border-color:rgba(167,139,250,.7);box-shadow:0 0 18px rgba(139,92,246,.28);transform:translateX(-2px)}
#ctonia-portal-back.visible{display:flex}
#ctonia-portal-back{width:auto!important;min-width:42px;padding:0 11px;gap:0;overflow:hidden;white-space:nowrap;font-size:13px!important;font-weight:700;letter-spacing:.06em}
#ctonia-portal-back .hub-back-label{display:inline-block;max-width:0;opacity:0;overflow:hidden;transition:max-width .25s ease,opacity .2s ease,margin-left .25s ease}
#ctonia-portal-back:hover .hub-back-label,#ctonia-portal-back:focus-visible .hub-back-label{max-width:56px;opacity:1;margin-left:6px}
</style>

<style> 
/* Mobile: altura real da tela, sem zoom de toque duplo, sem destaque de toque */
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,a,label,input,select{touch-action:manipulation}
@supports (height:100dvh){.h-screen{height:100dvh!important}.min-h-screen{min-height:100dvh!important}}

#ctonia-portal-back{top:max(16px,env(safe-area-inset-top))!important;left:max(16px,env(safe-area-inset-left))!important}
#theme-toggle{top:max(12px,env(safe-area-inset-top))!important;right:max(16px,env(safe-area-inset-right))!important}
#ctonia-library-overlay,#ctonia-manager-overlay{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
@media (max-width:640px){
  .portal-card{min-height:150px!important}
  .portal-header{padding-top:max(20px,env(safe-area-inset-top))!important}
  #hub-view header{padding-top:72px!important}
  #hub-view h1{font-size:2.2rem!important}
  #workspace-view header{padding-left:10px!important;padding-right:10px!important}
  #workspace-title{font-size:.95rem!important}
  #filters-nav{overflow-x:auto;flex-wrap:nowrap!important;justify-content:flex-start!important}
  #filters-nav>*{flex:none}
}
</style>
<style>
@media (max-width:768px){
  #workspace-view header{padding:8px 12px!important;padding-right:62px!important;gap:8px}
  #workspace-view header>.w-24{display:none!important}
  #workspace-view header button{white-space:nowrap;font-size:.8rem;gap:6px}
  #workspace-title{flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.85rem!important;letter-spacing:.04em!important}
  #workspace-content{flex-direction:column!important;overflow-y:auto!important;overflow-x:hidden!important}
  #workspace-content>div{flex:none!important;flex-direction:column!important;min-height:100%;overflow:visible!important;width:100%}
  #workspace-content [class*="w-80"],#workspace-content [class*="w-72"],#workspace-content [class*="w-96"],#workspace-content [class*="w-64"]{width:100%!important;max-width:100%!important;border-left:0!important;border-top:1px solid rgb(var(--night))}
  #workspace-content #tl{flex:none!important;min-height:230px;overflow:visible}
  #workspace-content #tl>div{padding:18px 14px!important}
  #workspace-content .overflow-y-auto{overflow:visible!important}
  #workspace-content .p-8,#workspace-content .p-12,#workspace-content .p-10{padding:16px!important}
  #workspace-content [class*="p-5"]{padding:14px!important}
  #workspace-content input,#workspace-content select,#workspace-content textarea{font-size:16px!important}
  #run-btn{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
  #workspace-content .grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  #workspace-content canvas,#workspace-content img{max-width:100%}
}
</style>
<style>
*,*::before,*::after{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.portal-header{background:rgb(var(--abyssal)/.96)!important}
#ctonia-library-overlay,#ctonia-manager-overlay,#ctonia-library-frame,#ctonia-manager-frame{box-shadow:none!important}
.bg-noise{display:none!important}
#workspace-view header{box-shadow:none!important}
</style>
</head>
<body class="antialiased flex flex-col h-screen overflow-hidden text-sm relative">
<a id="ctonia-portal-back" href="#" onclick="return voltarAoPortal(event)" aria-label="Voltar ao portal inicial" title="Voltar ao portal inicial"><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="m15 18-6-6 6-6"/><path d="M9 12h12"/></svg><span class="hub-back-label">Hub</span></a>

    <div class="bg-noise"></div>
    <button id="fs-toggle" type="button" onclick="toggleFullscreenCtonia()" aria-label="Tela cheia" title="Tela cheia (esconde a barra do navegador)" style="display:none;position:fixed;top:max(12px,env(safe-area-inset-top));right:max(64px,calc(env(safe-area-inset-right) + 64px));z-index:99998;width:40px;height:40px;border-radius:9999px;align-items:center;justify-content:center;border:1px solid rgb(var(--night));background:rgb(var(--indigo));color:rgb(var(--mystic));cursor:pointer">
        <svg id="fs-icon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button id="install-btn" type="button" onclick="installCtonia()" aria-label="Instalar app" title="Instalar o Ctônia como app" style="display:none;position:fixed;top:max(12px,env(safe-area-inset-top));right:max(112px,calc(env(safe-area-inset-right) + 112px));z-index:99998;width:40px;height:40px;border-radius:9999px;align-items:center;justify-content:center;border:1px solid rgb(var(--night));background:rgb(var(--indigo));color:rgb(var(--mystic));cursor:pointer">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>
    </button>
    <button id="theme-toggle" onclick="toggleTheme()" aria-label="Alternar tema claro/escuro" class="fixed top-3 right-4 z-[60] w-10 h-10 rounded-full border border-night bg-indigo text-mystic hover:text-luminous shadow-lg flex items-center justify-center transition-colors"><i id="theme-icon" class="fas fa-moon"></i></button>

    <!-- PORTAL INICIAL CTÔNIA -->
    <div id="portal-view" class="relative z-10 flex-1 overflow-y-auto">
        <header class="portal-header px-5 py-5 md:py-6 text-center">
            <div class="portal-brand text-3xl md:text-5xl font-bold uppercase text-salmon title-glow">Ctônia</div>
            <p class="mt-2 text-[10px] md:text-xs uppercase tracking-[.34em] text-mystic">Portal de ferramentas</p>
        </header>
        <main class="max-w-[1500px] mx-auto px-5 md:px-10 py-10 md:py-14">
            <div class="text-center mb-9 md:mb-12">
                
                <div class="w-20 h-px mx-auto mt-4" style="background:linear-gradient(90deg,transparent,rgb(var(--glow)/.8),transparent)"></div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 md:gap-5 items-stretch">
                <button type="button" class="portal-card" onclick="enterPdfHub()" aria-label="Abrir Forja">
                    <i class="portal-symbol fa-solid fa-fire-flame-curved" aria-hidden="true"></i>
                    <span class="portal-card-title">Forja</span>
                </button>
                <a class="portal-card" href="#arquivo" aria-label="Abrir Acervo Ctônia" onclick="portalPlaceholder(event,'Acervo')">
                    <i class="portal-symbol fa-solid fa-landmark" aria-hidden="true"></i>
                    <span class="portal-card-title">Acervo</span>
                </a>
                <a class="portal-card" href="#arquivo" aria-label="Abrir Biblioteca Ctônia" onclick="openCtoniaLibrary()">
                    <i class="portal-symbol fa-solid fa-book-open" aria-hidden="true"></i>
                    <span class="portal-card-title">Biblioteca</span>
                </a>
                <a class="portal-card" href="#arquivo" aria-label="Abrir Laboratório Ctônia" onclick="portalPlaceholder(event,'Laboratório')">
                    <i class="portal-symbol fa-solid fa-flask" aria-hidden="true"></i>
                    <span class="portal-card-title">Laboratório</span>
                </a>
                <button type="button" class="portal-card" aria-label="Abrir Gerenciar Ctônia" onclick="openCtoniaManager()">
                    <i class="portal-symbol fa-regular fa-compass" aria-hidden="true"></i>
                    <span class="portal-card-title">Gerenciar</span>
                </button>
            </div>
            <p class="text-center text-[10px] uppercase tracking-[.2em] text-mystic/70 mt-9">Conhecimento · Criação · Organização</p>
        </main>
    </div>

    <!-- VIEW PRINCIPAL (HUB) -->
    <div id="hub-view" class="relative z-10 hidden flex-col h-screen overflow-y-auto">
        <header class="pt-16 pb-8 px-4 text-center max-w-6xl mx-auto w-full">
            <h1 class="text-4xl md:text-6xl font-bold mb-8 tracking-widest text-salmon font-serif title-glow uppercase">Forja</h1>
            <nav id="filters-nav" class="flex flex-wrap justify-center gap-2 md:gap-6 border-b border-night pb-3 px-2"></nav>
        </header>

        <main class="max-w-[1400px] mx-auto px-6 md:px-12 pb-24 w-full flex-1">
            <div id="tools-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6"></div>
        </main>
    </div>

    <!-- VIEW DO WORKSPACE -->
    <div id="workspace-view" class="relative z-20 h-screen w-full hidden flex flex-col bg-abyssal">
        <header class="h-14 bg-indigo border-b border-night flex items-center justify-between px-4 shrink-0 shadow-md">
            <div class="flex items-center gap-4">
                <button onclick="closeWorkspace()" class="text-mystic hover:text-luminous flex items-center gap-2 font-medium tracking-wide transition-colors">
                    <i class="fas fa-arrow-left"></i> Retornar ao Hub
                </button>
            </div>
            <div class="font-serif text-salmon text-lg uppercase tracking-wider font-bold title-glow" id="workspace-title">Ferramenta</div>
            <div class="w-24"></div>
        </header>
        <main id="workspace-content" class="flex-1 flex overflow-hidden"></main>
    </div>

    <!-- GERENCIADOR CTÔNIA EMBUTIDO (documento isolado em iframe) -->
    <section id="ctonia-manager-overlay" class="fixed inset-0 z-[100] hidden flex-col bg-[#1B132B]" aria-label="Gerenciador Ctônia">
        <iframe id="ctonia-manager-frame" title="Ctônia Manager" class="w-full flex-1 border-0 bg-[#1B132B]" style="min-height:0;height:100%" loading="eager"></iframe>
    </section>

    <!-- BIBLIOTECA CTÔNIA EMBUTIDA (documento isolado em iframe) -->
    <section id="ctonia-library-overlay" class="fixed inset-0 z-[101] hidden flex-col bg-[#1B132B]" aria-label="Biblioteca Ctônia">
        <iframe id="ctonia-library-frame" title="Ctônia Biblioteca" class="w-full flex-1 border-0 bg-[#1B132B]" style="min-height:0;height:100%" loading="eager"></iframe>
    </section>

    <!-- MODAL GLOBAL -->
    <div id="global-modal" class="fixed inset-0 z-50 modal-overlay hidden flex items-center justify-center p-4">
        <div id="modal-content" class="bg-indigo border border-night rounded-xl shadow-2xl max-w-lg w-full p-6 text-center transform scale-95 transition-transform">
            <!-- Injetado dinamicamente -->
        </div>
    </div>

    <script>
        // --- 1. DADOS ---
        const categories = [
            "Todas", "Organizar PDF", "Otimizar PDF", "Converter PDF", "Editar PDF", "Segurança de PDF", "Fluxos de trabalho"
        ];

        const toolsData = [
            // Organizar
            { id: 'juntar', title: 'Juntar PDF', cat: 'Organizar PDF', icon: 'fa-object-group' },
            { id: 'dividir', title: 'Dividir PDF', cat: 'Organizar PDF', icon: 'fa-cut' },
            { id: 'organizar', title: 'Organizar PDF', cat: 'Organizar PDF', icon: 'fa-layer-group' },

        async function generateConvertedPdf() {
            if(currentFiles.length === 0) return alert("Adicione imagens primeiro!");
            
            const orientation = document.querySelector('input[name="orientation"]:checked').value;
            const size = document.getElementById('pdf-size').value;
            const margin = parseInt(document.getElementById('pdf-margin').value);

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: orientation, format: size });
            
            const pageWidth = doc.internal.pageSize.getWidth();
            const pageHeight = doc.internal.pageSize.getHeight();
            
            for (let i = 0; i < currentFiles.length; i++) {
                if (i > 0) doc.addPage();
                
                const imgData = currentFiles[i].data;
                const imgProps = doc.getImageProperties(imgData);
                
                // Calcular dimensões mantendo proporção e aplicando margem
                const availWidth = pageWidth - (margin * 2);
                const availHeight = pageHeight - (margin * 2);
                
                const ratio = Math.min(availWidth / imgProps.width, availHeight / imgProps.height);
                const drawWidth = imgProps.width * ratio;
                const drawHeight = imgProps.height * ratio;
                
                // Centralizar
                const x = margin + (availWidth - drawWidth) / 2;
                const y = margin + (availHeight - drawHeight) / 2;

                doc.addImage(imgData, imgProps.fileType, x, y, drawWidth, drawHeight);
            }

            doc.save("ctonia_grimorio.pdf");
        }

                    <div class="flex-1 p-5 overflow-y-auto space-y-5">${t.fields.map(f=>`<div><h3 class="text-xs text-night uppercase tracking-widest font-bold mb-2">${f.label}</h3>${f.opts?`<select id="o-${f.k}" class="w-full bg-abyssal border border-night text-salmon text-sm rounded p-2.5 outline-none focus:border-luminous">${f.opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select>`:`<input id="o-${f.k}" type="${f.type||'text'}" value="${f.def??''}" placeholder="${f.ph||''}" class="w-full bg-abyssal border border-night text-salmon text-sm rounded p-2.5 outline-none focus:border-luminous">`}</div>`).join('')||'<p class="text-xs text-night italic">Sem opções: basta processar.</p>'}</div>
                    <div class="p-6 border-t border-night"><button id="run-btn" onclick="runTool('${tool.id}')" class="w-full bg-magenta hover:opacity-90 text-abyssal font-bold uppercase tracking-wider py-4 rounded-lg shadow-lg transition-all flex items-center justify-center gap-3">Processar <i class="fas fa-magic"></i></button></div>
                </div></div>`;
            drawList(tool.id);
        }
        function drawList(id){
            const t=T[id];
            document.getElementById('tl').innerHTML=`<div class="flex-1 overflow-auto p-8 flex flex-col items-center" ondragover="event.preventDefault()" ondrop="event.preventDefault();addFiles('${id}',event.dataTransfer.files)">
                <label class="cursor-pointer bg-magenta text-abyssal px-8 py-4 rounded-lg font-bold uppercase shadow-lg mb-3"><i class="fas fa-plus"></i> ${t.multi?'Selecionar arquivos':'Selecionar arquivo'}<input type="file" class="hidden" ${t.multi?'multiple':''} accept="${t.accept}" onchange="addFiles('${id}',this.files)"></label>
                <p class="text-mystic text-xs mb-6">ou arraste para cá${t.multi?' (arraste os itens para reordenar)':''}</p>
                <div id="fl" class="w-full max-w-xl space-y-2">${tf.map((f,i)=>`<div class="bg-indigo border border-night rounded p-3 flex items-center gap-3 ${t.multi?'cursor-move':''}"><i class="fas fa-file-pdf text-mystic"></i><span class="flex-1 truncate text-salmon text-xs">${f.name}</span><span class="text-[10px] text-mystic">${kb(f.size)}</span><button onclick="tf.splice(${i},1);drawList('${id}')" class="text-magenta"><i class="fas fa-times"></i></button></div>`).join('')}</div></div>`;
            new Sortable(document.getElementById('fl'),{animation:150,onEnd:e=>tf.splice(e.newIndex,0,tf.splice(e.oldIndex,1)[0])});
        }
        function addFiles(id,fl){const t=T[id];let a=[...fl];if(!t.multi){a=a.slice(0,1);tf=[]}tf.push(...a);drawList(id)}
        async function runTool(id){
            if(!tf.length)return alert('Adicione um arquivo primeiro.');
            const t=T[id],o={},b=document.getElementById('run-btn');
            t.fields.forEach(f=>o[f.k]=document.getElementById('o-'+f.k).value);
            b.disabled=true;b.innerHTML='<i class="fas fa-spinner fa-spin"></i> Processando...';
            try{
                await lib('pdflib');
                let r=await t.run(tf,o);if(!Array.isArray(r))r=[r];
                const out=r.length>1?{name:'ctonia_'+id+'.zip',blob:await zipIt(r)}:r[0];
                showResult(id,out)
            }catch(e){console.error(e);alert('Erro: '+e.message)}
            b.disabled=false;b.innerHTML='Processar <i class="fas fa-magic"></i>';
        }
        function showResult(id,out){
            window._out=out;
            document.getElementById('tl').innerHTML=`<div class="flex-1 flex flex-col items-center justify-center text-center p-8">
                <i class="fas fa-check-circle text-6xl text-mystic mb-4"></i>
                <h2 class="text-2xl font-serif text-salmon title-glow uppercase mb-2">Rito concluído</h2>
                <p class="text-xs text-mystic mb-6">${out.name} · ${kb(out.blob.size)}${out.note?'<br>'+out.note:''}</p>
                <button onclick="dl(_out.blob,_out.name)" class="bg-luminous text-abyssal px-10 py-4 rounded-lg font-bold text-lg uppercase shadow-lg mb-4"><i class="fas fa-download"></i> Baixar</button>
                <button onclick="drawList('${id}')" class="text-xs text-night underline">Processar outro arquivo</button></div>`;
            tf=[];
        }


        // --- ORGANIZAR PDF: miniaturas, ordem manual e ordenação crescente/decrescente ---
        let organizeFile = null;
        let organizePages = [];
        let organizeSortable = null;

        function renderOrganizePdf() {
            organizeFile = null;
            organizePages = [];
            workspaceContent.innerHTML = `
                <div class="flex-1 flex flex-col lg:flex-row min-h-0 bg-abyssal">
                    <section class="flex-1 min-w-0 flex flex-col">
                        <div class="min-h-14 px-4 md:px-6 py-3 bg-indigo/60 border-b border-night flex flex-wrap items-center gap-2">
                            <span class="font-serif uppercase tracking-wider text-salmon font-bold text-xs mr-2">Páginas do documento</span>
                            <button onclick="sortOrganizePages('asc')" class="px-3 py-2 rounded text-xs bg-abyssal text-mystic border border-night hover:border-luminous"><i class="fas fa-sort-numeric-down"></i> Ordem crescente</button>
                            <button onclick="sortOrganizePages('desc')" class="px-3 py-2 rounded text-xs bg-abyssal text-mystic border border-night hover:border-luminous"><i class="fas fa-sort-numeric-up"></i> Ordem decrescente</button>
                            <span id="organize-count" class="ml-auto text-xs text-mystic">Nenhum PDF carregado</span>
                        </div>
                        <div id="organize-stage" class="flex-1 overflow-auto p-5 md:p-8 editor-canvas-bg">
                            <div id="organize-empty" class="min-h-[300px] flex flex-col items-center justify-center text-center">
                                <i class="fas fa-file-pdf text-6xl text-night mb-5"></i>
                                <h2 class="font-serif text-xl text-salmon mb-2">Organize as páginas do seu PDF</h2>
                                <p class="text-mystic text-sm max-w-md">Carregue um PDF para visualizar todas as páginas. Arraste as miniaturas para definir a nova ordem.</p>
                            </div>
                            <div id="organize-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5 gap-4"></div>
                        </div>
                    </section>
                    <aside class="w-full lg:w-80 shrink-0 bg-indigo border-t lg:border-t-0 lg:border-l border-night flex flex-col">
                        <div class="p-5 border-b border-night"><h2 class="font-serif text-lg text-salmon uppercase">Organizar PDF</h2><p class="text-xs text-mystic mt-2">A ordem exibida será a ordem do arquivo final.</p></div>
                        <div class="p-5 space-y-4 flex-1">
                            <label class="block cursor-pointer text-center bg-abyssal border border-night hover:border-luminous rounded-lg p-4 text-salmon font-semibold">
                                <i class="fas fa-folder-open mr-2"></i> Selecionar PDF
                                <input id="organize-upload" type="file" accept="application/pdf,.pdf" class="hidden" onchange="loadOrganizePdf(this.files[0])">
                            </label>
                            <div class="text-xs text-mystic leading-relaxed">• Arraste uma página para movê-la.<br>• Crescente: 1, 2, 3, 4, 5…<br>• Decrescente: última página até a primeira.<br>• O arquivo original não será alterado.</div>
                            <div id="organize-status" class="text-xs text-mystic"></div>
                        </div>
                        <div class="p-5 border-t border-night">
                            <button id="organize-export" onclick="exportOrganizedPdf()" disabled class="w-full disabled:opacity-40 bg-magenta hover:opacity-90 text-abyssal font-bold uppercase py-4 rounded-lg shadow-lg"><i class="fas fa-download mr-2"></i> Salvar PDF organizado</button>
                        </div>
                    </aside>
                </div>`;
        }

        async function loadOrganizePdf(file) {
            if (!file) return;
            if (organizeSortable) { organizeSortable.destroy(); organizeSortable = null; }
            organizeFile = file;
            organizePages = [];
            const status = document.getElementById('organize-status');
            const grid = document.getElementById('organize-grid');
            const empty = document.getElementById('organize-empty');
            const exportBtn = document.getElementById('organize-export');
            status.textContent = 'Carregando e renderizando páginas…';
            grid.innerHTML = '';
            empty.classList.add('hidden');
            exportBtn.disabled = true;
            try {
                await lib('pdfjs');
                const pdf = await pdfjsLib.getDocument({data: await buf(file)}).promise;
                for (let n = 1; n <= pdf.numPages; n++) {
                    status.textContent = `Renderizando página ${n} de ${pdf.numPages}…`;
                    const page = await pdf.getPage(n);
                    const viewport = page.getViewport({scale: 0.42});
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.ceil(viewport.width);
                    canvas.height = Math.ceil(viewport.height);
                    await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
                    organizePages.push({sourceIndex: n - 1, originalNumber: n, thumbnail: canvas.toDataURL('image/jpeg', 0.78)});
                }
                document.getElementById('organize-count').textContent = `${organizePages.length} página(s)`;
                renderOrganizePages();
                status.textContent = 'Pronto. Arraste as páginas para reorganizar.';
                exportBtn.disabled = false;
            } catch (err) {
                console.error(err);
                status.textContent = /password/i.test(err.message || '') ? 'Este PDF exige senha de abertura e não pode ser exibido sem ela.' : `Não foi possível abrir o PDF: ${err.message}`;
                empty.classList.remove('hidden');
                empty.querySelector('h2').textContent = 'Não foi possível carregar o PDF';
            }
        }

        function renderOrganizePages() {
            const grid = document.getElementById('organize-grid');
            if (!grid) return;
            grid.innerHTML = organizePages.map((p, i) => `
                <div class="organize-page bg-indigo border border-night rounded-xl p-3 cursor-grab active:cursor-grabbing shadow-lg hover:border-luminous transition-colors" data-index="${p.sourceIndex}">
                    <div class="flex items-center justify-between text-[10px] text-mystic mb-2"><span>Posição ${i + 1}</span><span>Original ${p.originalNumber}</span></div>
                    <div class="bg-white rounded p-2 flex items-center justify-center min-h-[170px]">
                        <img src="${p.thumbnail}" alt="Página original ${p.originalNumber}" class="max-w-full max-h-64 object-contain pointer-events-none">
                    </div>
                    <div class="text-center text-xs text-salmon mt-2 font-semibold">Página ${i + 1}</div>
                </div>`).join('');
            if (organizeSortable) organizeSortable.destroy();
            organizeSortable = new Sortable(grid, {
                animation: 180,
                ghostClass: 'opacity-40',
                chosenClass: 'ring-2',
                onEnd: () => {
                    const order = Array.from(grid.children).map(el => Number(el.dataset.index));
                    organizePages = order.map(index => organizePages.find(p => p.sourceIndex === index));
                    renderOrganizePages();
                }
            });
        }

        function sortOrganizePages(direction) {
            if (!organizePages.length) return;
            organizePages.sort((a, b) => direction === 'asc' ? a.originalNumber - b.originalNumber : b.originalNumber - a.originalNumber);
            renderOrganizePages();
            const status = document.getElementById('organize-status');
            if (status) status.textContent = direction === 'asc' ? 'Páginas em ordem crescente: 1, 2, 3…' : 'Páginas em ordem decrescente.';
        }

        async function exportOrganizedPdf() {
            if (!organizeFile || !organizePages.length) return;
            const btn = document.getElementById('organize-export');
            const status = document.getElementById('organize-status');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Gerando PDF…';
            try {
                await lib('pdflib');
                const source = await PDFLib.PDFDocument.load(await buf(organizeFile));
                const output = await PDFLib.PDFDocument.create();
                const indices = organizePages.map(p => p.sourceIndex);
                const copied = await output.copyPages(source, indices);
                copied.forEach(page => output.addPage(page));
                const bytes = await output.save();
                dl(pb(bytes), `${bn(organizeFile)}_organizado.pdf`);
                status.textContent = 'PDF organizado gerado e baixado.';
            } catch (err) {
                console.error(err);
                alert('Não foi possível salvar o PDF: ' + err.message);
                status.textContent = 'Falha ao gerar o arquivo.';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-download mr-2"></i> Salvar PDF organizado';
            }
        }

        // --- INICIALIZAÇÃO ---
        renderFilters();
        renderTools();
        applyTheme(document.documentElement.classList.contains('light')?'light':'dark');
    </script>

<script>
function voltarAoPortal(event){
  if(event) event.preventDefault();
  const portal=document.getElementById('portal-view');
  const hub=document.getElementById('hub-view');
  const workspace=document.getElementById('workspace-view');
  const modal=document.getElementById('global-modal');
  if(portal) portal.classList.remove('hidden');
  if(hub){hub.classList.add('hidden');hub.classList.remove('flex');}
  if(workspace) workspace.classList.add('hidden');
  if(modal) modal.classList.add('hidden');
  window.scrollTo({top:0,behavior:'smooth'});
  atualizarBotaoVoltar();
  return false;
}
function atualizarBotaoVoltar(){
  const back=document.getElementById('ctonia-portal-back');
  const hub=document.getElementById('hub-view');
  const workspace=document.getElementById('workspace-view');
  if(!back) return;
  const hubAtivo=hub && !hub.classList.contains('hidden');
  const workspaceAtivo=workspace && !workspace.classList.contains('hidden');
  // O botão aparece somente na tela do Hub, nunca dentro de uma ferramenta.
  back.classList.toggle('visible',!!hubAtivo && !workspaceAtivo);
}
document.addEventListener('DOMContentLoaded', atualizarBotaoVoltar);
const observerVoltar=new MutationObserver(atualizarBotaoVoltar);
observerVoltar.observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
</script>

        let ctoniaLibraryLoaded = false;
        function openCtoniaLibrary() {
            const overlay = document.getElementById('ctonia-library-overlay');
            const frame = document.getElementById('ctonia-library-frame');
            if (!ctoniaLibraryLoaded) {
                const bytes = Uint8Array.from(atob(CTONIA_LIBRARY_HTML_B64), c => c.charCodeAt(0));
                frame.srcdoc = new TextDecoder('utf-8').decode(bytes);
                ctoniaLibraryLoaded = true;
            }
            document.getElementById('portal-view').classList.add('hidden');
            document.getElementById('hub-view').classList.add('hidden');
            document.getElementById('workspace-view').classList.add('hidden');
            document.getElementById('ctonia-manager-overlay').classList.add('hidden');
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            document.body.classList.add('overflow-hidden');
        }
        function closeCtoniaLibrary() {
            const overlay = document.getElementById('ctonia-library-overlay');
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
            document.getElementById('portal-view').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        let ctoniaManagerLoaded = false;
        function openCtoniaManager() {
            const overlay = document.getElementById('ctonia-manager-overlay');
            const frame = document.getElementById('ctonia-manager-frame');
            if (!ctoniaManagerLoaded) {
                const bytes = Uint8Array.from(atob(CTonIA_MANAGER_HTML_B64), c => c.charCodeAt(0));
                frame.srcdoc = new TextDecoder('utf-8').decode(bytes);
                ctoniaManagerLoaded = true;
            }
            document.getElementById('portal-view').classList.add('hidden');
            document.getElementById('hub-view').classList.add('hidden');
            document.getElementById('workspace-view').classList.add('hidden');
            document.getElementById('ctonia-library-overlay').classList.add('hidden');
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            document.body.classList.remove('overflow-hidden');
            document.body.classList.add('overflow-hidden');
        }
        function closeCtoniaManager() {
            const overlay = document.getElementById('ctonia-manager-overlay');
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
            document.getElementById('portal-view').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                const libraryOverlay = document.getElementById('ctonia-library-overlay');
                const managerOverlay = document.getElementById('ctonia-manager-overlay');
                if (libraryOverlay && !libraryOverlay.classList.contains('hidden')) closeCtoniaLibrary();
                else if (managerOverlay && !managerOverlay.classList.contains('hidden')) closeCtoniaManager();
            }
        });

<script>
/* ===== PWA: instalação, tela cheia e atalhos ===== */
(function(){
  // Service worker (só funciona em https ou localhost)
  if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
    window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(e){console.warn('SW',e)})});
  }
  // Cor da barra do sistema acompanha o tema
  var meta=document.querySelector('meta[name="theme-color"]');
  function syncThemeColor(){if(meta)meta.setAttribute('content',document.documentElement.classList.contains('light')?'#F0EAD8':'#1B132B')}
  new MutationObserver(syncThemeColor).observe(document.documentElement,{attributes:true,attributeFilter:['class']});syncThemeColor();
  // Tela cheia: esconde a barra do navegador (Android/PC). Não existe no iPhone.
  var root=document.documentElement,btn=document.getElementById('fs-toggle');
  var standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  var canFs=!!(root.requestFullscreen||root.webkitRequestFullscreen);
  var inst=document.getElementById('install-btn'),deferred=null,portal=document.getElementById('portal-view');
  function onPortal(){return portal&&!portal.classList.contains('hidden')}
  function syncPortalButtons(){
    var on=onPortal();
    if(btn)btn.style.display=(on&&canFs&&!standalone)?'flex':'none';
    if(inst)inst.style.display=(on&&deferred&&!standalone)?'flex':'none';
  }
  if(portal)new MutationObserver(syncPortalButtons).observe(portal,{attributes:true,attributeFilter:['class']});
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;syncPortalButtons()});
  window.addEventListener('appinstalled',function(){deferred=null;syncPortalButtons()});
  window.installCtonia=function(){if(!deferred)return;deferred.prompt();deferred.userChoice.finally(function(){deferred=null;syncPortalButtons()})};
  syncPortalButtons();
  window.toggleFullscreenCtonia=function(){
    var fs=document.fullscreenElement||document.webkitFullscreenElement;
    if(fs){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
    else{var p=(root.requestFullscreen||root.webkitRequestFullscreen).call(root,{navigationUI:'hide'});if(p&&p.catch)p.catch(function(){})}
  };
  // Atalhos do ícone (Biblioteca / Forja / Gerenciar)
  window.addEventListener('load',function(){
    var o=new URLSearchParams(location.search).get('open');
    try{
      if(o==='library')openCtoniaLibrary();
      else if(o==='forja')enterPdfHub();
      else if(o==='manager')openCtoniaManager();
    }catch(e){}
    if(o&&history.replaceState)history.replaceState(null,'',location.pathname);
  });
})();
</script>
