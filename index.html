<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ctônia — Portal</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#1B132B">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Ctônia">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Bibliotecas Externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- jsPDF para gerar PDF e SortableJS para arrastar -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

    <script>try{if(localStorage.getItem("ct-theme")==="light")document.documentElement.classList.add("light")}catch(e){}</script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: Object.fromEntries(['abyssal','indigo','night','mint','mystic','luminous','magenta','salmon'].map(n=>[n,`rgb(var(--${n}) / <alpha-value>)`]))
                    ,
                    fontFamily: {
                        serif: ['Cinzel', 'serif'],
                        sans: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        :root{--abyssal:27 19 43;--indigo:37 43 80;--night:74 110 138;--mint:30 77 79;--mystic:59 140 136;--luminous:123 240 195;--magenta:232 90 113;--salmon:255 190 166;--glow:255 190 166}
        /* Modo claro: Areia #E4DCC4, Terracota #DA6A4E, Cobre #A25732, Coral #E1414F, Amarelo-Sol #FFE268, Ciano #00D0FE, Azul-bebê #A9E9FF */
        html.light{--abyssal:228 220 196;--indigo:240 234 216;--night:162 87 50;--mint:255 226 104;--mystic:218 106 78;--luminous:0 208 254;--magenta:225 65 79;--salmon:58 31 18;--glow:169 233 255}
        html.light .bg-magenta{color:#fff!important}
        html.light .bg-luminous{color:#3A1F12!important}
        html.light body{background-image:radial-gradient(circle at 85% 0%,rgba(169,233,255,.55),transparent 45%),radial-gradient(circle at 0 100%,rgba(255,226,104,.35),transparent 40%)}
        body{background-color:rgb(var(--abyssal));color:rgb(var(--salmon));margin:0;overflow-x:hidden;font-family:'Montserrat',sans-serif;transition:background-color .3s,color .3s}
        ::selection{background:rgb(var(--glow)/.6)}
        .bg-noise{position:fixed;top:0;left:0;width:100%;height:100vh;pointer-events:none;z-index:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E")}
        .title-glow{text-shadow:0 0 20px rgb(var(--glow)/.3)}
        ::-webkit-scrollbar{width:8px;height:8px}
        ::-webkit-scrollbar-track{background:rgb(var(--abyssal))}
        ::-webkit-scrollbar-thumb{background:rgb(var(--night));border-radius:4px}
        ::-webkit-scrollbar-thumb:hover{background:rgb(var(--mystic))}
        .fade-in{animation:fadeIn .4s ease forwards}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .tool-card{position:relative;isolation:isolate;background-color:rgb(var(--indigo));border:1px solid rgb(var(--night));transition:all .3s cubic-bezier(.25,.46,.45,.94)}
        .tool-card::before{content:'';position:absolute;inset:-2px;border-radius:inherit;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgb(var(--glow)/.20),transparent 68%);opacity:.52;filter:blur(13px);transition:opacity .3s,filter .3s}
        .tool-card:hover{border-color:rgb(var(--luminous));background-color:rgb(var(--mint));transform:translateY(-5px);box-shadow:0 0 24px rgb(var(--glow)/.22),0 10px 30px -10px rgb(var(--mint)/.6)}
        .tool-card:hover::before{opacity:.95;filter:blur(17px)}
        .tool-card:hover h3{color:rgb(var(--salmon))}
        .tool-card:hover .icon-wrapper{color:rgb(var(--luminous));transform:scale(1.1)}
        .editor-canvas-bg{background-image:linear-gradient(45deg,rgb(var(--abyssal)) 25%,transparent 25%,transparent 75%,rgb(var(--abyssal)) 75%),linear-gradient(45deg,rgb(var(--abyssal)) 25%,transparent 25%,transparent 75%,rgb(var(--abyssal)) 75%);background-size:20px 20px;background-position:0 0,10px 10px;background-color:rgb(var(--indigo))}
        .modal-overlay{background-color:rgb(var(--abyssal)/.85);backdrop-filter:blur(4px)}
        /* Portal Ctônia */
        #portal-view{min-height:100vh;background:radial-gradient(ellipse at 50% 0%,rgb(var(--mint)/.22),transparent 46%),rgb(var(--abyssal));}
        .portal-header{position:sticky;top:0;z-index:40;backdrop-filter:blur(16px);background:rgb(var(--abyssal)/.76);border-bottom:1px solid rgb(var(--night)/.5)}
        .portal-brand{font-family:'Cinzel',serif;letter-spacing:.28em;text-shadow:0 0 12px rgb(var(--glow)/.22),0 0 28px rgb(var(--glow)/.16)}

        .ct-backup-bar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;margin-top:34px}
        .ct-backup-bar button{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;border:1px solid rgb(var(--mystic)/.45);background:rgb(var(--indigo)/.7);color:rgb(var(--salmon));font:600 11px/1 inherit;text-transform:uppercase;letter-spacing:.12em;cursor:pointer;transition:border-color .2s,transform .2s}
        .ct-backup-bar button:hover{border-color:rgb(var(--luminous));transform:translateY(-1px)}
        #ct-backup-info{font-size:11px;color:rgb(var(--mystic));opacity:.85}#ct-backup-info.old{color:#e9c46a;opacity:1}
        #ct-backup-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,80px);opacity:0;transition:.3s;z-index:300;background:rgb(var(--salmon));color:#1B132B;padding:11px 18px;border-radius:10px;font:600 13px/1.3 sans-serif;max-width:90vw;text-align:center;pointer-events:none}#ct-backup-toast.on{transform:translate(-50%,0);opacity:1}
        .portal-card{position:relative;isolation:isolate;min-height:clamp(260px,36vw,430px);border:1px solid rgb(var(--mystic)/.42);background:linear-gradient(160deg,rgb(var(--indigo)/.92),rgb(var(--abyssal)/.95));border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px 14px;text-align:center;overflow:hidden;transition:transform .24s ease,border-color .24s ease,box-shadow .24s ease,background .24s ease;color:rgb(var(--mystic));text-decoration:none;cursor:pointer}
        .portal-card::before{content:'';position:absolute;inset:-15%;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,rgb(var(--mystic)/.22),transparent 60%);filter:blur(18px);opacity:.78;transition:all .24s ease}
        .portal-card::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(145deg,transparent 25%,rgb(var(--glow)/.06),transparent 72%);opacity:.3;transition:opacity .24s ease}
        .portal-card:hover,.portal-card:focus-visible{transform:translateY(-7px);border-color:rgb(var(--glow)/.9);color:rgb(var(--glow));box-shadow:0 0 0 1px rgb(var(--glow)/.16),0 0 32px rgb(var(--glow)/.24),0 18px 45px rgb(0 0 0/.2);outline:none}
        .portal-card:hover::before,.portal-card:focus-visible::before{background:radial-gradient(ellipse at 50% 48%,rgb(var(--glow)/.42),transparent 62%);filter:blur(23px);opacity:1}
        .portal-card:hover::after{opacity:.9}
        .portal-card .portal-symbol{font-size:clamp(3.2rem,5vw,5rem);filter:drop-shadow(0 0 12px rgb(var(--mystic)/.35));transition:transform .24s ease,filter .24s ease,color .24s ease}
        .portal-card:hover .portal-symbol{transform:scale(1.1);filter:drop-shadow(0 0 17px rgb(var(--glow)/.72))}
        .portal-card-title{font-family:'Cinzel',serif;font-size:clamp(.8rem,1.1vw,1rem);font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:rgb(var(--salmon));transition:color .24s ease,text-shadow .24s ease}
        .portal-card:hover .portal-card-title{color:rgb(var(--glow));text-shadow:0 0 16px rgb(var(--glow)/.5)}
        .portal-card .portal-caption{font-size:.72rem;line-height:1.6;color:rgb(var(--mystic));max-width:15rem}
        html.light .portal-card{background:linear-gradient(160deg,rgb(var(--indigo)/.94),rgb(var(--abyssal)/.96))}
        /* No modo claro, preserva o fundo original do card: só muda o tom da reação luminosa azulada para roxo-obsidiana. */
        html.light .portal-card:hover,html.light .portal-card:focus-visible{background:linear-gradient(160deg,rgb(var(--indigo)/.94),rgb(var(--abyssal)/.96));border-color:#8b70b5;box-shadow:0 0 0 1px rgb(111 76 151/.16),0 0 26px rgb(73 43 105/.22),0 18px 45px rgb(30 15 45/.12)}
        html.light .portal-card:hover::before,html.light .portal-card:focus-visible::before{background:radial-gradient(ellipse at 50% 48%,rgb(76 43 105/.32),transparent 64%);filter:blur(22px);opacity:.95}
        html.light .portal-card:hover .portal-symbol,html.light .portal-card:focus-visible .portal-symbol{color:rgb(var(--glow));filter:drop-shadow(0 0 10px rgb(76 43 105/.42))}
        html.light .portal-card:hover .portal-card-title,html.light .portal-card:focus-visible .portal-card-title{color:rgb(var(--glow));text-shadow:0 0 12px rgb(76 43 105/.28)}
        /* Os cards de ferramentas também mantêm o fundo-base no hover do tema claro; apenas o halo fica roxo-obsidiana. */
        html.light .tool-card:hover{background-color:rgb(var(--indigo));border-color:#8b70b5;box-shadow:0 0 24px rgb(76 43 105/.20),0 10px 30px -10px rgb(30 15 45/.14)}
        html.light .tool-card:hover::before{background:radial-gradient(ellipse at 50% 45%,rgb(76 43 105/.30),transparent 68%);opacity:.95;filter:blur(17px)}
        @media(prefers-reduced-motion:reduce){.portal-card,.portal-card *,.tool-card,.tool-card::before{transition:none!important;animation:none!important}}
    
/* Superfície clara consistente com o Gerenciador */
html.light #portal-view{background:radial-gradient(ellipse at 50% 0%,#e4e9d8 0%,transparent 48%),#e6dfc8!important}
html.light .portal-header{background:rgba(230,223,200,.88)!important}

</style>

<style>
#ctonia-portal-back{position:fixed;top:16px;left:16px;z-index:99999;width:42px;height:42px;display:none;align-items:center;justify-content:center;border:1px solid rgba(129,140,248,.28);border-radius:12px;background:rgba(15,23,42,.72);color:var(--salmon,#d7c3a5);font-size:24px;line-height:1;text-decoration:none;box-shadow:0 0 18px rgba(99,102,241,.12);backdrop-filter:blur(8px);transition:color .18s,border-color .18s,box-shadow .18s,transform .18s}
#ctonia-portal-back:hover{color:#c4b5fd;border-color:rgba(167,139,250,.7);box-shadow:0 0 18px rgba(139,92,246,.28);transform:translateX(-2px)}
#ctonia-portal-back.visible{display:flex}
#ctonia-portal-back{width:auto!important;min-width:42px;padding:0 11px;gap:0;overflow:hidden;white-space:nowrap;font-size:13px!important;font-weight:700;letter-spacing:.06em}
#ctonia-portal-back .hub-back-label{display:inline-block;max-width:0;opacity:0;overflow:hidden;transition:max-width .25s ease,opacity .2s ease,margin-left .25s ease}
#ctonia-portal-back:hover .hub-back-label,#ctonia-portal-back:focus-visible .hub-back-label{max-width:56px;opacity:1;margin-left:6px}
</style>

<style> 
/* Mobile: altura real da tela, sem zoom de toque duplo, sem destaque de toque */
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,a,label,input,select{touch-action:manipulation}
@supports (height:100dvh){.h-screen{height:100dvh!important}.min-h-screen{min-height:100dvh!important}}

#ctonia-portal-back{top:max(16px,env(safe-area-inset-top))!important;left:max(16px,env(safe-area-inset-left))!important}
#theme-toggle{top:max(12px,env(safe-area-inset-top))!important;right:max(16px,env(safe-area-inset-right))!important}
#ctonia-library-overlay,#ctonia-manager-overlay{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
@media (max-width:640px){
  .portal-card{min-height:150px!important}
  .portal-header{padding-top:max(20px,env(safe-area-inset-top))!important}
  #hub-view header{padding-top:72px!important}
  #hub-view h1{font-size:2.2rem!important}
  #workspace-view header{padding-left:10px!important;padding-right:10px!important}
  #workspace-title{font-size:.95rem!important}
  #filters-nav{overflow-x:auto;flex-wrap:nowrap!important;justify-content:flex-start!important}
  #filters-nav>*{flex:none}
}
</style>
<style>
@media (max-width:768px){
  #workspace-view header{padding:8px 12px!important;padding-right:62px!important;gap:8px}
  #workspace-view header>.w-24{display:none!important}
  #workspace-view header button{white-space:nowrap;font-size:.8rem;gap:6px}
  #workspace-title{flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.85rem!important;letter-spacing:.04em!important}
  #workspace-content{flex-direction:column!important;overflow-y:auto!important;overflow-x:hidden!important}
  #workspace-content>div{flex:none!important;flex-direction:column!important;min-height:100%;overflow:visible!important;width:100%}
  #workspace-content [class*="w-80"],#workspace-content [class*="w-72"],#workspace-content [class*="w-96"],#workspace-content [class*="w-64"]{width:100%!important;max-width:100%!important;border-left:0!important;border-top:1px solid rgb(var(--night))}
  #workspace-content #tl{flex:none!important;min-height:230px;overflow:visible}
  #workspace-content #tl>div{padding:18px 14px!important}
  #workspace-content .overflow-y-auto{overflow:visible!important}
  #workspace-content .p-8,#workspace-content .p-12,#workspace-content .p-10{padding:16px!important}
  #workspace-content [class*="p-5"]{padding:14px!important}
  #workspace-content input,#workspace-content select,#workspace-content textarea{font-size:16px!important}
  #run-btn{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
  #workspace-content .grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  #workspace-content canvas,#workspace-content img{max-width:100%}
}
</style>
<style>
*,*::before,*::after{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.portal-header{background:rgb(var(--abyssal)/.96)!important}
#ctonia-library-overlay,#ctonia-manager-overlay,#ctonia-library-frame,#ctonia-manager-frame{box-shadow:none!important}
.bg-noise{display:none!important}
#workspace-view header{box-shadow:none!important}
</style>
<style>
.ct-astro{--ct-sun:#f4bd55;--ct-moon:#b9c9ff;--ct-mercury:#a9e5cf;--ct-venus:#f3a8c7;--ct-mars:#f08b76;--ct-jupiter:#c6a6ff;--ct-saturn:#c6b9a4;--ct-fire:#ed9a68;--ct-earth:#9bc79a;--ct-air:#a9d9ed;--ct-water:#8ab8f3;width:min(100%,1180px);margin:18px auto 26px;padding:0 16px;color:var(--astro-text,#e8e3ef);font-family:Montserrat,Arial,sans-serif}
.ct-astro-inner{position:relative;overflow:hidden;border:1px solid #8e8ac14d;border-radius:26px;padding:clamp(18px,3vw,30px);text-align:center;background:linear-gradient(125deg,#17172bdf,#202b3cdd 58%,#28203adf);box-shadow:0 12px 36px #09091435,inset 0 1px #ffffff0b}
.ct-astro-inner:before{content:"";position:absolute;inset:-50%;pointer-events:none;background:conic-gradient(from 0deg,transparent,#6e8fe61c,transparent,#b4a0ff19,transparent);animation:none}
.ct-astro-inner>*{position:relative}.ct-astro-clock{font:700 clamp(3rem,8vw,6rem)/1 'Montserrat',sans-serif;letter-spacing:.06em;color:#e5e8ff;text-shadow:0 0 10px #7d91ff8a,0 0 34px #6e8ff65e;font-variant-numeric:tabular-nums}
.ct-astro-day{display:flex;justify-content:center;align-items:center;gap:12px;margin:12px 0 20px;font-family:Georgia,serif;font-size:clamp(1rem,2vw,1.35rem);letter-spacing:.07em}
.ct-day-sym,.ct-planet{color:var(--c,var(--ct-sun));font-size:1.7em;text-shadow:0 0 9px currentColor,0 0 20px color-mix(in srgb,currentColor 45%,transparent)}
.ct-astro-bodies{display:flex;justify-content:center;align-items:stretch;gap:clamp(16px,4vw,48px);flex-wrap:wrap}
.ct-body{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;font-size:clamp(.85rem,1.7vw,1.08rem);padding:12px 18px;border-radius:18px;background:#ffffff08;border:1px solid #aab7e22b}
.ct-body .ct-in{opacity:.65;font-style:italic}.ct-sign{font-size:1.55em;text-shadow:0 0 12px currentColor}.el-fire{color:#f0a06b}.el-earth{color:#a5d7a0}.el-air{color:#a8dff1}.el-water{color:#91b9ff}
.ct-sun .ct-planet{--c:var(--ct-sun)}.ct-moon .ct-planet{--c:var(--ct-moon)}
.ct-astro-phase{display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap;margin:16px 0 10px;color:#d3d7ee;font-size:.82rem}.ct-phase-ico{display:inline-flex;filter:drop-shadow(0 0 7px #b9c9ff80)}.ct-astro-city{border:1px solid #9aa8d54d;border-radius:999px;background:#ffffff08;color:inherit;padding:7px 13px;font-size:.78rem;cursor:pointer;transition:.2s}.ct-astro-city:hover{box-shadow:0 0 18px #8ca7ff65;border-color:#9fb5ff}
.ct-astro-overlay{position:fixed;inset:0;z-index:999999;background:#090914c9;display:grid;place-items:center;padding:16px}.ct-astro-modal{width:min(520px,100%);max-height:85vh;overflow:auto;background:#1d1b2c;color:#f2eff9;border:1px solid #8d8ac0;border-radius:20px;padding:18px;box-shadow:0 0 40px #8094ff22}.ct-astro-modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.ct-astro-modal button,.ct-astro-modal input{font:inherit}.ct-astro-modal .ct-geo,.ct-astro-modal .ct-c-ok{padding:9px 12px;border-radius:10px;background:#343451;border:1px solid #7777a8;margin:6px 0}.ct-astro-modal .ct-search,.ct-astro-modal .ct-custom input{width:100%;padding:10px;border-radius:9px;background:#111120;border:1px solid #555577;color:white;margin:8px 0}.ct-astro-modal .ct-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.ct-astro-modal .ct-list button{padding:8px;border-radius:8px;text-align:left;background:#ffffff09;border:1px solid #ffffff15;color:inherit}.ct-astro-modal .ct-list button.on{border-color:#a5b4fc;box-shadow:0 0 10px #818cf855}.ct-astro-modal .ct-custom-row{display:grid;gap:5px}.ct-note{font-size:.75rem;opacity:.7;margin-top:12px}
@keyframes astroHalo{to{transform:rotate(360deg)}}@media(max-width:640px){.ct-astro{padding:0 10px;margin:12px auto}.ct-astro-bodies{gap:9px}.ct-body{width:100%;gap:7px;padding:11px 8px}.ct-astro-clock{font-size:clamp(2.8rem,18vw,4.5rem)}.ct-astro-inner{border-radius:19px}.ct-astro-modal .ct-list{grid-template-columns:1fr}}
html.light .ct-astro{color:#342d43}html.light .ct-astro-inner{background:linear-gradient(125deg,#fbf7ed,#e9f3f1 58%,#f0eafa);border-color:#c6c4d8;box-shadow:0 12px 30px #51426812,inset 0 1px #fff}html.light .ct-astro-clock{color:#39335b;text-shadow:0 0 10px #8795e85e,0 0 26px #9aa5ef45}html.light .ct-astro-day{color:#423957}html.light .ct-body{background:#fff8;border-color:#8b87a52b}html.light .ct-astro-phase{color:#4d4861}html.light .ct-astro-city{background:#fff8;color:#3d3650;border-color:#aaa6c6}
@media(prefers-reduced-motion:reduce){.ct-astro-inner:before{animation:none}}
/* Tesouraria: confirmação visual de salvar e OC em esmeralda suave */
#container-oc{background:rgba(72,166,125,.12)!important;border-color:#73c9a2!important}
#container-oc label{color:#8ed9b6!important}
#container-oc input{border-color:#72bd9b!important;box-shadow:inset 0 0 0 1px #72bd9b20!important}
#container-oc input:focus{outline:2px solid #72cfa4!important;box-shadow:0 0 0 4px #54c99525!important}
#form-novo-item button[type=submit],button[onclick*="saveItem"]{background:linear-gradient(135deg,#4d9e7d,#76c7a1)!important;border-color:#86d8b3!important;color:#102e24!important;box-shadow:0 0 16px #5fc69b24!important}
#form-novo-item button[type=submit]:hover,button[onclick*="saveItem"]:hover{box-shadow:0 0 22px #62d6a45e!important;transform:translateY(-1px)}

        var b = document.createElement('button'); b.type = 'button'; b.textContent = c[0]; if (c[0] === city.name) b.className = 'on';
        b.addEventListener('click', function(){ setCity({ name:c[0], lat:c[1], lon:c[2], tz:c[3] }); closePicker(); });
        list.appendChild(b);
      });
      if (!list.children.length) list.innerHTML = '<p class="ct-empty">Nenhuma cidade na lista — use “Outro local”.</p>';
    }
    fill(''); search.addEventListener('input', function(){ fill(search.value); });
    ov.querySelector('.ct-geo').addEventListener('click', function(){
      var b = this; if (!navigator.geolocation) { b.textContent = 'Geolocalização indisponível neste navegador'; return; }
      b.textContent = 'Buscando localização…';
      navigator.geolocation.getCurrentPosition(function(pos){
        var lat = pos.coords.latitude, lon = pos.coords.longitude, n = nearest(lat, lon);
        setCity(n ? { name:n[0], lat:lat, lon:lon, tz:n[3] } : { name:'Local atual (' + lat.toFixed(2) + ', ' + lon.toFixed(2) + ')', lat:lat, lon:lon, tz:BR });

      var lat = parseFloat(String(ov.querySelector('.ct-c-lat').value).replace(',','.')), lon = parseFloat(String(ov.querySelector('.ct-c-lon').value).replace(',','.'));
      if (!isFinite(lat) || !isFinite(lon) || Math.abs(lat) > 89 || Math.abs(lon) > 180) { ov.querySelector('.ct-c-lat').focus(); return; }
      setCity({ name: ov.querySelector('.ct-c-name').value.trim() || ('Local (' + lat.toFixed(2) + ', ' + lon.toFixed(2) + ')'), lat:lat, lon:lon, tz:BR });
      closePicker();
    });
    setTimeout(function(){ search.focus(); }, 30);
  }

  function init(){
    document.querySelectorAll('[data-ct-astro]').forEach(function(h){ if (!h.classList.contains('ct-astro')) build(h); });
    if (!roots.length) return;
    render();
    setInterval(function(){ if (!document.hidden) render(); }, 1000);
  }

    <script>

        // Portal inicial: destinos configuráveis para os próximos módulos.
        // Os cartões Biblioteca e Explorar são links reais (menu de contexto do navegador habilitado),

        function enterPdfHub() {
            document.getElementById('portal-view').classList.add('hidden');
            const hub = document.getElementById('hub-view');
            hub.classList.remove('hidden');
            hub.classList.add('flex');

        }

        /* === Backup e importação de todos os dados do site === */
        const CT_IDB = 'kindle-web-reader';
        function ctBackupToast(msg) {
            let t = document.getElementById('ct-backup-toast');
            if (!t) { t = document.createElement('div'); t.id = 'ct-backup-toast'; document.body.appendChild(t); }
            t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 4200);
        }
        function ctBackupInfo() {
            const el = document.getElementById('ct-backup-info'); if (!el) return;
            let d = null; try { d = localStorage.getItem('ct_last_backup'); } catch (e) {}
            if (!d) { el.textContent = 'Nenhum backup feito ainda'; el.classList.add('old'); return; }
            const dt = new Date(d), dias = Math.floor((Date.now() - dt) / 864e5);
            el.textContent = 'Último backup: ' + dt.toLocaleDateString('pt-BR') + ' às ' + dt.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            el.classList.toggle('old', dias >= 3);
        }
        function ctIdbOpen() {
            return new Promise((res, rej) => {
                const r = indexedDB.open(CT_IDB, 1);
                r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('books')) d.createObjectStore('books', { keyPath: 'id' }); if (!d.objectStoreNames.contains('files')) d.createObjectStore('files'); if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta'); };
                r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
            });
        }
        const ctReq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
        async function ctIdbDump() {
            try {
                if (!indexedDB.databases) return null;
                if (!(await indexedDB.databases()).some(d => d.name === CT_IDB)) return null;
                const db = await ctIdbOpen();
                try {
                    const tx = db.transaction(['books', 'meta'], 'readonly');
                    const books = await ctReq(tx.objectStore('books').getAll());
                    const mk = await ctReq(tx.objectStore('meta').getAllKeys()), mv = await ctReq(tx.objectStore('meta').getAll());
                    const meta = {}; mk.forEach((k, i) => meta[k] = mv[i]);
                    return { books, meta };
                } finally { db.close(); }
            } catch (e) { return null; }
        }
        async function ctIdbRestore(d) {
            if (!d || !window.indexedDB) return;
            const db = await ctIdbOpen();
            try {
                const tx = db.transaction(['books', 'meta'], 'readwrite');
                (d.books || []).forEach(b => tx.objectStore('books').put(b));
                Object.keys(d.meta || {}).forEach(k => tx.objectStore('meta').put(d.meta[k], k));
                await new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = tx.onabort = () => rej(tx.error); });
            } finally { db.close(); }
        }
        async function ctBackupExport(prefix) {
            const out = { app: 'ctonia-backup', version: 2, date: new Date().toISOString(), localStorage: {}, indexedDB: null };
            for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (/^kwr_gtoken/.test(k)) continue; out.localStorage[k] = localStorage.getItem(k); }
            out.indexedDB = await ctIdbDump();
            const n = Object.keys(out.localStorage).length;
            const z = x => String(x).padStart(2, '0'), d = new Date();
            const name = (prefix || 'backup-ctonia') + '-' + d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + '_' + z(d.getHours()) + '-' + z(d.getMinutes()) + '.json';
            const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(out)], { type: 'application/json' })); a.download = name;
            document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
            if (!prefix) { try { localStorage.setItem('ct_last_backup', out.date); } catch (e) {} ctBackupInfo(); ctBackupToast('Backup gerado: ' + n + ' itens salvos em ' + name); }
        }
        function ctBackupImport() {
            const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json';
            i.onchange = () => {
                const f = i.files[0]; if (!f) return; const r = new FileReader();
                r.onload = async () => {
                    try {
                        const o = JSON.parse(r.result);
                        const ls = (o && o.app === 'ctonia-backup') ? o.localStorage : o;
                        const keys = Object.keys(ls || {}).filter(k => typeof ls[k] === 'string' && !/^kwr_gtoken/.test(k));
                        if (!keys.length) throw new Error('vazio');
                        const nb = o && o.indexedDB && o.indexedDB.books ? o.indexedDB.books.length : 0;
                        const quando = o && o.date ? ' de ' + new Date(o.date).toLocaleString('pt-BR') : '';
                        if (!confirm('Importar backup' + quando + '?\n\n' + keys.length + ' itens de dados' + (nb ? ' e ' + nb + ' livros da Biblioteca' : '') + '.\nIsso substitui os dados atuais correspondentes. Uma cópia de segurança do que existe hoje será baixada antes.')) return;
                        const tem = ['contabil_items', 'tarefas_items', 'ct_medicoes_v1', 'ct_academia_v1'].some(k => { const v = localStorage.getItem(k); return v && v.length > 4; });
                        if (tem) await ctBackupExport('antes-da-importacao');
                        keys.forEach(k => localStorage.setItem(k, ls[k]));
                        if (o.indexedDB) await ctIdbRestore(o.indexedDB);
                        ctBackupToast('Backup importado com sucesso. Recarregando…'); setTimeout(() => location.reload(), 1200);
                    } catch (e) { ctBackupToast('Arquivo de backup inválido ou corrompido.'); }
                };
                r.readAsText(f);
            };
            i.click();
        }
        document.addEventListener('DOMContentLoaded', ctBackupInfo); ctBackupInfo();
        try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
        function portalPlaceholder(event, name) {
            // Preserva o menu de contexto nativo do link para abrir/copiar o destino.
            if (event && (event.ctrlKey || event.metaKey || event.button === 1)) return;
            if (event) event.preventDefault();
            showModal(`<h3 class="font-serif text-xl text-salmon mb-3">${name}</h3><p class="text-mystic text-sm">Este espaço está reservado para o módulo ${name}. O link já pode ser substituído pela URL definitiva no HTML.</p><button onclick="hideModal()" class="mt-5 px-5 py-2 bg-magenta text-white rounded">Entendi</button>`);
        }

        // Estado Global
        let currentFiles = []; // Para ImgToPDF
        let savedWorkflows = []; // Para fluxos

        // --- 2. RENDERIZAÇÃO DO HUB ---
        const filtersNav = document.getElementById('filters-nav');
        const toolsGrid = document.getElementById('tools-grid');
        let currentFilter = 'Todas';

        function renderFilters() {
            filtersNav.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `filter-btn text-[10px] sm:text-xs md:text-sm font-semibold tracking-widest uppercase pb-2 border-b-2 transition-colors duration-300 ${cat === currentFilter ? 'active border-magenta text-salmon' : 'border-transparent text-night hover:text-salmon hover:border-mystic'}`;
                btn.innerText = cat;
                btn.onclick = () => {
                    currentFilter = cat;
                    renderFilters();
                    renderTools();
                };
                filtersNav.appendChild(btn);
            });
        }

        function renderTools() {
            toolsGrid.innerHTML = '';
            const filtered = currentFilter === 'Todas' ? toolsData : toolsData.filter(t => t.cat === currentFilter);
            
            filtered.forEach((tool, index) => {
                const card = document.createElement('div');
                card.className = `tool-card rounded-xl p-6 flex flex-col items-center justify-center text-center cursor-pointer fade-in group relative overflow-hidden`;
                card.style.animationDelay = `${index * 0.02}s`;
                card.onclick = () => openWorkspace(tool);
                card.innerHTML = `
                    <div class="absolute inset-0 bg-gradient-to-t from-mint/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <div class="icon-wrapper mb-4 text-mystic transition-all duration-300 z-10 relative">
                        <i class="fa-solid ${tool.icon} text-4xl drop-shadow-[0_0_8px_rgba(59,140,136,0.5)]"></i>
                    </div>
                    <h3 class="font-serif text-base font-bold text-night mb-2 uppercase tracking-wide z-10 relative transition-colors">${tool.title}</h3>
                `;
                toolsGrid.appendChild(card);
            });
        }

        // --- 3. WORKSPACE MANAGER ---
        const hubView = document.getElementById('hub-view');
        const workspaceView = document.getElementById('workspace-view');
        const workspaceTitle = document.getElementById('workspace-title');
        const workspaceContent = document.getElementById('workspace-content');

        function openWorkspace(tool) {
            hubView.classList.add('hidden');
            workspaceView.classList.remove('hidden');
            workspaceTitle.innerText = tool.title;
            workspaceContent.innerHTML = ''; 

            if (tool.id === 'organizar') renderOrganizePdf();
            else if (tool.handler === 'imgToPdf') renderImgToPdf();
            else if (tool.handler === 'workflows') renderWorkflowsList();
            else if (tool.handler === 'signPdf') renderSignPdf();
            else if (T[tool.id]) renderTool(tool);
            else renderGeneric(tool);
        }

        function closeWorkspace() {
            workspaceView.classList.add('hidden');
            hubView.classList.remove('hidden');
            currentFiles = []; // limpar files
        }

        function renderGeneric(tool) {
            workspaceContent.innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center p-10 text-center">
                    <i class="fa-solid ${tool.icon} text-9xl text-night mb-8 opacity-50"></i>
                    <h2 class="text-3xl font-serif text-salmon mb-4 uppercase tracking-widest">${tool.title}</h2>
                    <p class="text-mystic max-w-lg mb-8">Esta ferramenta ainda está sendo desenvolvida.</p>
                </div>
            `;
        }

        // --- 4. MODAL MANAGER ---
        function showModal(html) {
            const modal = document.getElementById('global-modal');
            const content = document.getElementById('modal-content');
            content.innerHTML = html;
            modal.classList.remove('hidden');
            setTimeout(() => content.classList.remove('scale-95'), 10);
        }

        function hideModal() {
            const modal = document.getElementById('global-modal');
            const content = document.getElementById('modal-content');
            content.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 200);
        }

        // --- 5. FERRAMENTA: IMAGEM PARA PDF ---
        function renderImgToPdf() {
            workspaceContent.innerHTML = `
                <div class="flex-1 flex bg-abyssal relative">
                    <!-- Esquerda: Upload e Grid -->
                    <div class="flex-1 editor-canvas-bg flex flex-col relative overflow-hidden">
                        
                        <!-- Toolbar Superior (Ordenação) -->
                        <div class="h-14 border-b border-night bg-indigo/50 flex items-center px-6 gap-4 z-10">
                            <span class="text-salmon font-serif uppercase tracking-wider text-xs font-bold">Arquivos Místicos</span>
                            <div class="w-px h-5 bg-night mx-2"></div>
                            <button onclick="sortFiles('asc')" class="px-3 py-1.5 rounded text-xs bg-abyssal text-mystic hover:text-luminous border border-night hover:border-luminous transition-all"><i class="fas fa-sort-alpha-down"></i> A-Z</button>
                            <button onclick="sortFiles('desc')" class="px-3 py-1.5 rounded text-xs bg-abyssal text-mystic hover:text-luminous border border-night hover:border-luminous transition-all"><i class="fas fa-sort-alpha-up"></i> Z-A</button>
                            <label class="ml-auto cursor-pointer bg-magenta hover:bg-[#c9495f] text-abyssal px-4 py-1.5 rounded text-xs font-bold uppercase transition-colors shadow-[0_0_10px_rgba(232,90,113,0.3)]">
                                <i class="fas fa-plus"></i> Adicionar
                                <input type="file" multiple accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                            </label>
                        </div>

                        <!-- Grid Area -->
                        <div class="flex-1 overflow-auto p-8">
                            <div id="img-grid" class="flex flex-wrap gap-6 justify-center items-start">
                                <!-- Imagens Injetadas Aqui -->
                            </div>
                            <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none opacity-50">
                                <i class="far fa-images text-6xl text-night mb-4"></i>
                                <p class="text-mystic text-lg font-serif">Arraste runas (imagens) ou clique em adicionar</p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Direita: Opções -->
                    <div class="w-80 bg-indigo border-l border-night flex flex-col z-10 shadow-[-10px_0_20px_rgba(27,19,43,0.5)]">
                        <div class="p-5 border-b border-night"><h2 class="font-serif text-lg text-salmon uppercase title-glow">Opções de Rito</h2></div>
                        
                        <div class="flex-1 p-5 overflow-y-auto space-y-6">
                            <!-- Orientação -->
                            <div>
                                <h3 class="text-xs text-night uppercase tracking-widest font-bold mb-3">Orientação</h3>
                                <div class="grid grid-cols-2 gap-2">
                                    <label class="border border-night bg-abyssal hover:border-mystic rounded p-3 text-center cursor-pointer relative group">
                                        <input type="radio" name="orientation" value="p" checked class="absolute opacity-0">
                                        <div class="w-6 h-8 border-2 border-night group-hover:border-mystic mx-auto mb-2 rounded-sm transition-colors"></div>
                                        <span class="text-xs text-mystic group-hover:text-salmon transition-colors">Retrato</span>
                                    </label>
                                    <label class="border border-night bg-abyssal hover:border-mystic rounded p-3 text-center cursor-pointer relative group">
                                        <input type="radio" name="orientation" value="l" class="absolute opacity-0">
                                        <div class="w-8 h-6 border-2 border-night group-hover:border-mystic mx-auto mb-2 rounded-sm mt-1 transition-colors"></div>
                                        <span class="text-xs text-mystic group-hover:text-salmon transition-colors">Paisagem</span>
                                    </label>
                                </div>
                            </div>
                            
                            <!-- Tamanho -->
                            <div>
                                <h3 class="text-xs text-night uppercase tracking-widest font-bold mb-3">Tamanho</h3>
                                <select id="pdf-size" class="w-full bg-abyssal border border-night text-salmon text-sm rounded p-2.5 outline-none focus:border-luminous transition-colors appearance-none">
                                    <option value="a4">A4 (297 x 210 mm)</option>
                                    <option value="a5">A5 (210 x 148 mm)</option>
                                    <option value="letter">Carta (279 x 216 mm)</option>
                                </select>
                            </div>

                            <!-- Margem -->
                            <div>
                                <h3 class="text-xs text-night uppercase tracking-widest font-bold mb-3">Margem</h3>
                                <select id="pdf-margin" class="w-full bg-abyssal border border-night text-salmon text-sm rounded p-2.5 outline-none focus:border-luminous transition-colors appearance-none">
                                    <option value="0">Sem Margem</option>
                                    <option value="10">Pequena</option>
                                    <option value="20">Grande</option>
                                </select>
                            </div>
                        </div>

                        <div class="p-6 border-t border-night bg-abyssal/30">
                            <button onclick="generateConvertedPdf()" class="w-full bg-magenta hover:bg-[#c9495f] text-abyssal font-bold uppercase tracking-wider py-4 rounded-lg shadow-[0_0_15px_rgba(232,90,113,0.3)] transition-all flex items-center justify-center gap-3">
                                Converter em PDF <i class="fas fa-magic"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            initSortable();
        }

        function handleImageUpload(event) {
            const files = Array.from(event.target.files);
            if(files.length === 0) return;

            document.getElementById('empty-state').style.display = 'none';

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    currentFiles.push({ name: file.name, data: e.target.result, id: Date.now() + Math.random() });
                    renderImgGrid();
                };
                reader.readAsDataURL(file);
            });
        }

        function renderImgGrid() {
            const grid = document.getElementById('img-grid');
            grid.innerHTML = '';
            
            if(currentFiles.length === 0) {
                document.getElementById('empty-state').style.display = 'flex';
                return;
            }

            currentFiles.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'w-36 flex flex-col gap-2 cursor-move group';
                item.dataset.id = file.id;
                item.innerHTML = `
                    <div class="relative w-full h-48 bg-abyssal border border-night rounded overflow-hidden group-hover:border-luminous transition-colors shadow-lg">
                        <img src="${file.data}" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity">
                        <button onclick="removeImg('${file.id}')" class="absolute top-1 right-1 bg-magenta text-white w-6 h-6 rounded-full opacity-0 group-hover:opacity-100 flex items-center justify-center text-xs transition-opacity"><i class="fas fa-times"></i></button>
                        <div class="absolute bottom-0 left-0 right-0 bg-indigo/90 text-[9px] text-salmon text-center py-1 border-t border-night truncate px-1">${file.name}</div>
                    </div>
                `;
                grid.appendChild(item);
            });
        }

        function removeImg(id) {
            currentFiles = currentFiles.filter(f => f.id.toString() !== id.toString());
            renderImgGrid();
        }

        function sortFiles(order) {
            currentFiles.sort((a, b) => {
                return order === 'asc' ? a.name.localeCompare(b.name, undefined, {numeric:true,sensitivity:'base'}) : b.name.localeCompare(a.name, undefined, {numeric:true,sensitivity:'base'});
            });
            renderImgGrid();
        }

        function initSortable() {
            const grid = document.getElementById('img-grid');
            if(grid) {
                new Sortable(grid, {
                    animation: 150,
                    ghostClass: 'opacity-50',
                    onEnd: function (evt) {
                        // Reordenar array interno com base no DOM
                        const newOrder = Array.from(grid.children).map(el => el.dataset.id);
                        currentFiles = newOrder.map(id => currentFiles.find(f => f.id.toString() === id));
                    },
                });
            }
        }

        async function generateConvertedPdf() {
            if(currentFiles.length === 0) return alert("Adicione imagens primeiro!");
            
            const orientation = document.querySelector('input[name="orientation"]:checked').value;
            const size = document.getElementById('pdf-size').value;
            const margin = parseInt(document.getElementById('pdf-margin').value);

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: orientation, format: size });
            
            const pageWidth = doc.internal.pageSize.getWidth();
            const pageHeight = doc.internal.pageSize.getHeight();
            
            for (let i = 0; i < currentFiles.length; i++) {
                if (i > 0) doc.addPage();
                
                const imgData = currentFiles[i].data;
                const imgProps = doc.getImageProperties(imgData);
                
                // Calcular dimensões mantendo proporção e aplicando margem
                const availWidth = pageWidth - (margin * 2);
                const availHeight = pageHeight - (margin * 2);
                
                const ratio = Math.min(availWidth / imgProps.width, availHeight / imgProps.height);
                const drawWidth = imgProps.width * ratio;
                const drawHeight = imgProps.height * ratio;
                
                // Centralizar
                const x = margin + (availWidth - drawWidth) / 2;
                const y = margin + (availHeight - drawHeight) / 2;

                doc.addImage(imgData, imgProps.fileType, x, y, drawWidth, drawHeight);
            }

            doc.save("ctonia_grimorio.pdf");
        }


        // --- 6. FERRAMENTA: FLUXOS DE TRABALHO ---
        function renderWorkflowsList() {
            let listHtml = savedWorkflows.length === 0 ? `
                <div class="flex flex-col items-center justify-center p-12 opacity-70">
                    <i class="fa-solid fa-diagram-project text-6xl text-night mb-4"></i>
                    <p class="text-mystic">Nenhum rito criado ainda.</p>

                    canvas.height = Math.ceil(viewport.height);
                    await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
                    organizePages.push({sourceIndex: n - 1, originalNumber: n, thumbnail: canvas.toDataURL('image/jpeg', 0.78)});
                }
                document.getElementById('organize-count').textContent = `${organizePages.length} página(s)`;
                renderOrganizePages();
                status.textContent = 'Pronto. Arraste as páginas para reorganizar.';
                exportBtn.disabled = false;
            } catch (err) {
                console.error(err);
                status.textContent = /password/i.test(err.message || '') ? 'Este PDF exige senha de abertura e não pode ser exibido sem ela.' : `Não foi possível abrir o PDF: ${err.message}`;
                empty.classList.remove('hidden');
                empty.querySelector('h2').textContent = 'Não foi possível carregar o PDF';
            }
        }

        function renderOrganizePages() {
            const grid = document.getElementById('organize-grid');
            if (!grid) return;
            grid.innerHTML = organizePages.map((p, i) => `
                <div class="organize-page bg-indigo border border-night rounded-xl p-3 cursor-grab active:cursor-grabbing shadow-lg hover:border-luminous transition-colors" data-index="${p.sourceIndex}">
                    <div class="flex items-center justify-between text-[10px] text-mystic mb-2"><span>Posição ${i + 1}</span><span>Original ${p.originalNumber}</span></div>
                    <div class="bg-white rounded p-2 flex items-center justify-center min-h-[170px]">
                        <img src="${p.thumbnail}" alt="Página original ${p.originalNumber}" class="max-w-full max-h-64 object-contain pointer-events-none">
                    </div>
                    <div class="text-center text-xs text-salmon mt-2 font-semibold">Página ${i + 1}</div>
                </div>`).join('');
            if (organizeSortable) organizeSortable.destroy();
            organizeSortable = new Sortable(grid, {
                animation: 180,
                ghostClass: 'opacity-40',
                chosenClass: 'ring-2',
                onEnd: () => {
                    const order = Array.from(grid.children).map(el => Number(el.dataset.index));
                    organizePages = order.map(index => organizePages.find(p => p.sourceIndex === index));
                    renderOrganizePages();
                }
            });
        }

        function sortOrganizePages(direction) {
            if (!organizePages.length) return;
            organizePages.sort((a, b) => direction === 'asc' ? a.originalNumber - b.originalNumber : b.originalNumber - a.originalNumber);
            renderOrganizePages();
            const status = document.getElementById('organize-status');
            if (status) status.textContent = direction === 'asc' ? 'Páginas em ordem crescente: 1, 2, 3…' : 'Páginas em ordem decrescente.';
        }

        async function exportOrganizedPdf() {
            if (!organizeFile || !organizePages.length) return;
            const btn = document.getElementById('organize-export');
            const status = document.getElementById('organize-status');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Gerando PDF…';
            try {
                await lib('pdflib');
                const source = await PDFLib.PDFDocument.load(await buf(organizeFile));
                const output = await PDFLib.PDFDocument.create();
                const indices = organizePages.map(p => p.sourceIndex);
                const copied = await output.copyPages(source, indices);
                copied.forEach(page => output.addPage(page));
                const bytes = await output.save();
                dl(pb(bytes), `${bn(organizeFile)}_organizado.pdf`);
                status.textContent = 'PDF organizado gerado e baixado.';
            } catch (err) {
                console.error(err);
                alert('Não foi possível salvar o PDF: ' + err.message);
                status.textContent = 'Falha ao gerar o arquivo.';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-download mr-2"></i> Salvar PDF organizado';
            }
        }

        // --- INICIALIZAÇÃO ---
        renderFilters();
        renderTools();
        applyTheme(document.documentElement.classList.contains('light')?'light':'dark');
    </script>

<script>
function voltarAoPortal(event){
  if(event) event.preventDefault();
  const portal=document.getElementById('portal-view');
  const hub=document.getElementById('hub-view');
  const workspace=document.getElementById('workspace-view');
  const modal=document.getElementById('global-modal');
  if(portal) portal.classList.remove('hidden');
  if(hub){hub.classList.add('hidden');hub.classList.remove('flex');}
  if(workspace) workspace.classList.add('hidden');
  if(modal) modal.classList.add('hidden');
  window.scrollTo({top:0,behavior:'smooth'});
  atualizarBotaoVoltar();
  return false;
}
function atualizarBotaoVoltar(){
  const back=document.getElementById('ctonia-portal-back');
  const hub=document.getElementById('hub-view');
  const workspace=document.getElementById('workspace-view');
  if(!back) return;
  const hubAtivo=hub && !hub.classList.contains('hidden');
  const workspaceAtivo=workspace && !workspace.classList.contains('hidden');
  // O botão aparece somente na tela do Hub, nunca dentro de uma ferramenta.
  back.classList.toggle('visible',!!hubAtivo && !workspaceAtivo);
}
document.addEventListener('DOMContentLoaded', atualizarBotaoVoltar);
const observerVoltar=new MutationObserver(atualizarBotaoVoltar);
observerVoltar.observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
</script>

        function ctoniaEmbedAtmosphere() {
            // Reaproveita o mesmo fundo vivo do app nos iframes (Biblioteca e Gerenciar).
            const css = document.getElementById('ctonia-flow-bg').textContent;
            const js = document.getElementById('ctonia-flow-js').textContent;
            const extra = 'html:is(.light,:not(.light)):is(.hub-light,:not(.hub-light)) :is(#app,main){background:transparent!important;background-color:transparent!important}';
            return '<style id="ctonia-embedded-atmosphere">' + css + extra + '</style><script>' + js + '<\/script>';
        }
        let ctoniaLibraryLoaded = false;
        function openCtoniaLibrary() {
            const overlay = document.getElementById('ctonia-library-overlay');
            const frame = document.getElementById('ctonia-library-frame');
            if (!ctoniaLibraryLoaded) {
                const bytes = Uint8Array.from(atob(CTONIA_LIBRARY_HTML_B64), c => c.charCodeAt(0));
                let doc = new TextDecoder('utf-8').decode(bytes); doc = doc.replace(/<\/head>/i, () => ctoniaEmbedAtmosphere() + '</head>');
                frame.addEventListener('load', function syncEmbeddedTheme(){
                    try { const isLight = document.documentElement.classList.contains('light');
                        frame.contentDocument.documentElement.classList.toggle('light', isLight);
                        frame.contentDocument.documentElement.classList.toggle('dark', !isLight);
                    } catch(e) {}
                }, { once: true });
                frame.srcdoc = doc;
                ctoniaLibraryLoaded = true;
            }
            document.getElementById('portal-view').classList.add('hidden');
            document.getElementById('hub-view').classList.add('hidden');
            document.getElementById('workspace-view').classList.add('hidden');
            document.getElementById('ctonia-manager-overlay').classList.add('hidden');
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            document.body.classList.add('overflow-hidden');
        }
        function closeCtoniaLibrary() {
            const overlay = document.getElementById('ctonia-library-overlay');
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
            document.getElementById('portal-view').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        let ctoniaManagerLoaded = false;
        function openCtoniaManager() {
            const overlay = document.getElementById('ctonia-manager-overlay');
            const frame = document.getElementById('ctonia-manager-frame');

                let doc = new TextDecoder('utf-8').decode(bytes); doc = doc.replace(/<\/head>/i, () => ctoniaEmbedAtmosphere() + '</head>');
                frame.addEventListener('load', function syncEmbeddedTheme(){
                    try { const isLight = document.documentElement.classList.contains('light');
                        frame.contentDocument.documentElement.classList.toggle('light', isLight);
                        frame.contentDocument.documentElement.classList.toggle('dark', !isLight);
                    } catch(e) {}
                }, { once: true });
                frame.srcdoc = doc;
                ctoniaManagerLoaded = true;
            }
            document.getElementById('portal-view').classList.add('hidden');
            document.getElementById('hub-view').classList.add('hidden');
            document.getElementById('workspace-view').classList.add('hidden');
            document.getElementById('ctonia-library-overlay').classList.add('hidden');
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            document.body.classList.remove('overflow-hidden');
            document.body.classList.add('overflow-hidden');
        }
        function closeCtoniaManager() {

            const overlay = document.getElementById('ctonia-academia-overlay');
            const frame = document.getElementById('ctonia-academia-frame');
            if (!ctoniaAcademiaLoaded) {
                const bytes = Uint8Array.from(atob(CTONIA_ACADEMIA_HTML_B64), c => c.charCodeAt(0));
                const doc = new TextDecoder('utf-8').decode(bytes);
                frame.addEventListener('load', function(){
                    try { const isLight = document.documentElement.classList.contains('light');
                        frame.contentDocument.documentElement.classList.toggle('light', isLight);
                        frame.contentDocument.documentElement.classList.toggle('dark', !isLight);
                    } catch(e) {}
                }, { once: true });
                frame.srcdoc = doc;
                ctoniaAcademiaLoaded = true;
            }
            ['portal-view','hub-view','workspace-view','ctonia-manager-overlay','ctonia-library-overlay'].forEach(id => document.getElementById(id).classList.add('hidden'));
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            document.body.classList.add('overflow-hidden');
        }
        function closeCtoniaAcademia() {
            const overlay = document.getElementById('ctonia-academia-overlay');
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
            document.getElementById('portal-view').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && !document.getElementById('ctonia-academia-overlay').classList.contains('hidden')) closeCtoniaAcademia();
        });

        let ctoniaMedicoesLoaded = false;
        function openCtoniaMedicoes() {
            const overlay = document.getElementById('ctonia-medicoes-overlay');
            const frame = document.getElementById('ctonia-medicoes-frame');
            if (!ctoniaMedicoesLoaded) {
                const doc = new TextDecoder('utf-8').decode(Uint8Array.from(atob(CTONIA_MEDICOES_HTML_B64), c => c.charCodeAt(0)));
                frame.addEventListener('load', function(){
                    try { const isLight = document.documentElement.classList.contains('light');
                        frame.contentDocument.documentElement.classList.toggle('light', isLight);
                        frame.contentDocument.documentElement.classList.toggle('dark', !isLight);

                }, { once: true });
                frame.srcdoc = doc;
                ctoniaMedicoesLoaded = true;
            }
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
        }
        function closeCtoniaMedicoes() {
            const overlay = document.getElementById('ctonia-medicoes-overlay');
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
            try { const mf = document.getElementById('ctonia-manager-frame').contentWindow; if (mf && mf.ctRenderMedCard) mf.ctRenderMedCard(); } catch(e) {}
        }
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                const libraryOverlay = document.getElementById('ctonia-library-overlay');
                const managerOverlay = document.getElementById('ctonia-manager-overlay');
                const medOverlay = document.getElementById('ctonia-medicoes-overlay');
                if (medOverlay && !medOverlay.classList.contains('hidden')) closeCtoniaMedicoes();
                else if (libraryOverlay && !libraryOverlay.classList.contains('hidden')) closeCtoniaLibrary();
                else if (managerOverlay && !managerOverlay.classList.contains('hidden')) closeCtoniaManager();
            }
        });

<script>
/* ===== PWA: instalação, tela cheia e atalhos ===== */
(function(){
  // Service worker (só funciona em https ou localhost)
  if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
    window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(e){console.warn('SW',e)})});
  }
  // Cor da barra do sistema acompanha o tema
  var meta=document.querySelector('meta[name="theme-color"]');
  function syncThemeColor(){if(meta)meta.setAttribute('content',document.documentElement.classList.contains('light')?'#F0EAD8':'#1B132B')}
  new MutationObserver(syncThemeColor).observe(document.documentElement,{attributes:true,attributeFilter:['class']});syncThemeColor();
  // Tela cheia: esconde a barra do navegador (Android/PC). Não existe no iPhone.
  var root=document.documentElement,btn=document.getElementById('fs-toggle');
  var standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  var canFs=!!(root.requestFullscreen||root.webkitRequestFullscreen);
  var inst=document.getElementById('install-btn'),deferred=null,portal=document.getElementById('portal-view');
  function onPortal(){return portal&&!portal.classList.contains('hidden')}
  function syncPortalButtons(){
    var on=onPortal();
    if(btn)btn.style.display=(on&&canFs&&!standalone)?'flex':'none';
    if(inst)inst.style.display=(on&&deferred&&!standalone)?'flex':'none';
  }
  if(portal)new MutationObserver(syncPortalButtons).observe(portal,{attributes:true,attributeFilter:['class']});
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;syncPortalButtons()});
  window.addEventListener('appinstalled',function(){deferred=null;syncPortalButtons()});
  window.installCtonia=function(){if(!deferred)return;deferred.prompt();deferred.userChoice.finally(function(){deferred=null;syncPortalButtons()})};
  syncPortalButtons();
  window.toggleFullscreenCtonia=function(){
    var fs=document.fullscreenElement||document.webkitFullscreenElement;
    if(fs){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
    else{var p=(root.requestFullscreen||root.webkitRequestFullscreen).call(root,{navigationUI:'hide'});if(p&&p.catch)p.catch(function(){})}
  };
  // Atalhos do ícone (Biblioteca / Forja / Gerenciar)
  window.addEventListener('load',function(){
    var o=new URLSearchParams(location.search).get('open');
    try{
      if(o==='library')openCtoniaLibrary();
      else if(o==='forja')enterPdfHub();
      else if(o==='manager')openCtoniaManager();
    }catch(e){}
    if(o&&history.replaceState)history.replaceState(null,'',location.pathname);
  });
})();
</script>
